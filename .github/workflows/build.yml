name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.TAEKWONDO_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/taekwondo.jks"
          echo "TAEKWONDO_KEYSTORE_FILE=$RUNNER_TEMP/taekwondo.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          TAEKWONDO_STORE_PASS: ${{ secrets.TAEKWONDO_STORE_PASS }}
          TAEKWONDO_KEY_ALIAS: ${{ secrets.TAEKWONDO_KEY_ALIAS }}
          TAEKWONDO_KEY_PASS: ${{ secrets.TAEKWONDO_KEY_PASS }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taekwondo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: taekwondo-release-apk
          path: app/build/outputs/apk/release/*.apk
